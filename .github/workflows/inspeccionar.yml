name: Inspeccionar SEPA

on:
  workflow_dispatch:

jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UA: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
      BASE: "https://datos.produccion.gob.ar/dataset/6f47ec76-d1ce-4e34-a7e1-621fe9b1d0b5/resource"
    steps:
      - name: Prueba 1 - consultar la API del portal
        run: |
          curl -sS -L -i -A "$UA" --max-time 60 "https://datos.produccion.gob.ar/api/3/action/package_show?id=sepa-precios" -o respuesta.txt || echo "curl fallo con codigo $?"
          echo "Tamano de la respuesta: $(wc -c < respuesta.txt 2>/dev/null) bytes"
          echo "----- primeros 1500 caracteres -----"
          head -c 1500 respuesta.txt 2>/dev/null || true

      - name: Prueba 2 - consultar los enlaces directos de cada dia (solo cabeceras)
        run: |
          for par in \
            "lunes 0a9069a9-06e8-4f98-874d-da5578693290" \
            "martes 9dc06241-cc83-44f4-8e25-c9b1636b8bc8" \
            "miercoles 1e92cd42-4f94-4071-a165-62c4cb2ce23c" \
            "jueves d076720f-a7f0-4af8-b1d6-1b99d5a90c14" \
            "viernes 91bc072a-4726-44a1-85ec-4a8467aad27e" \
            "sabado b3c3da5d-213d-41e7-8d74-f23fda0a3c30" \
            "domingo f8e75128-515a-436e-bf8d-5c63a62f2005"; do
            set -- $par
            echo
            echo "===== $1 ====="
            curl -sS -L -I -A "$UA" --max-time 60 "$BASE/$2/download/sepa_$1.zip" 2>&1 | grep -iE '^(HTTP|location|content-length|content-type|last-modified|server)' || echo "sin respuesta"
          done
